# =============================================================================
# SFT (Supervised Fine-Tuning) Configuration
# =============================================================================

# Inherits from default.yaml - override model and training params here

sft:
  # Data generation
  data_generation:
    num_games: 700              # Total games to generate (AlphaBeta + VFP)
    alpha_beta_games: 500       # Games with AlphaBeta as expert
    vfp_games: 200              # Games with ValueFunctionPlayer as expert
    map_type: "MINI"
    vps_to_win: 6
    opponents:
      - "WeightedRandomPlayer"
      - "WeightedRandomPlayer"
    train_split: 0.9

  # Training
  training:
    output_dir: "./checkpoints/sft/"
    num_train_epochs: 3
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 2.0e-4
    lr_scheduler_type: "cosine"
    warmup_ratio: 0.1
    logging_steps: 10
    save_steps: 200
    eval_steps: 200
    max_seq_length: 2048
    packing: false
    dataset_text_field: "text"
    report_to: "none"
    run_name: "catan-sft-v1"
